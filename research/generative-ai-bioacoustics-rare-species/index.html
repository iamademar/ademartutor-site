<main style="max-width:720px;margin:0 auto;padding:48px 24px;font-family:Georgia,'Times New Roman',serif;color:#20251f;line-height:1.6">
  <p style="font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#76776b">An interactive reading · ≈12 min · COMPX525, University of Waikato</p>
  <h1 style="font-size:34px;line-height:1.15;margin:8px 0 16px">Can Generative AI Improve Bioacoustic Classification?</h1>
  <p style="font-size:18px;color:#43463c"><em>Can a general-purpose AI audio generator produce synthetic bird, frog, and insect calls realistic enough to help a classifier recognise a wetland's rarest species, the ones conservation most needs to find?</em></p>
  <p>Passive acoustic monitoring can survey ecosystems at scale, but rare species have too few recordings to learn from, and they are exactly the ones conservation needs to detect. If synthetic audio can fill that gap, it changes what is possible for biodiversity monitoring. This study tests that idea on the BirdCLEF-2026 target set: AudioLDM 2 generates candidate calls, BirdNET verifies them, and only the clips that pass join training.</p>
  <p style="font-family:system-ui,sans-serif;font-size:14px;color:#76776b">By <strong>Ademar Tutor</strong> · COMPX525, University of Waikato · 19 June 2026 · <a href="report/main.pdf" style="color:#2c5a4f">Read the full paper (31 pp)</a></p>

  <h2 style="font-size:22px;margin:28px 0 10px">Key findings</h2>
  <ul style="padding-left:20px">
    <li>Macro-AUC measures ranking quality averaged equally across classes, so a rare species counts as much as a common one (higher is better; 1.0 is perfect).</li>
    <li>The best configuration — a fine-tuned model with synthetic audio — reaches a macro-AUC of 0.9549.</li>
    <li>For the rarest classes (five or fewer examples), mean per-class AUC rises from 0.666 to 0.890 when synthetic audio is added — that is where manufactured data does real work.</li>
    <li>Of 3,484 generated clips, only 800 — 23% — passed BirdNET verification overall.</li>
    <li>Keep-rate splits sharply by taxon: Reptilia 78.1%, Insecta 67.9%, Amphibia 7.3%, Mammalia 6.4%, and Aves 0.0% — not a single generated bird clip was kept.</li>
    <li>Only about 2% of focal recordings fall inside the Pantanal itself, so the training audio barely comes from the target place (a domain shift between clean focal clips and messy field soundscapes).</li>
    <li>The gain concentrates where clips were actually kept: amphibians, which received synthetic audio, climb from 0.860 to 0.951, while birds, which got none, stay essentially flat near 0.96.</li>
  </ul>

// ===== Reusable Real/Synthetic WaveSurfer player (shared by every gallery card) =====
class WaveAB extends React.Component {
  constructor(p){
    super(p);
    this.state = { isReal: !!p.realSrc, playing:false, ready:false, err:false, cur:0, dur:0 };
    this.elRef = (el)=>{ this.el = el; };
  }
  fmt(s){ if(!isFinite(s)||s<0) s=0; const m=Math.floor(s/60); const ss=Math.floor(s%60); return m+':'+(ss<10?'0':'')+ss; }
  curSrc(){ return this.state.isReal ? this.props.realSrc : this.props.synthSrc; }
  componentDidMount(){
    if(typeof WaveSurfer==='undefined'){ this._retry=setTimeout(()=>this.componentDidMount(),200); return; }
    if(!this.el) return;
    const src=this.curSrc();
    if(!src){ this.setState({err:true}); return; }
    try {
      this.ws = WaveSurfer.create({
        container:this.el, height:56,
        waveColor:C.line, progressColor:this.state.isReal?C.teal:C.amber, cursorColor:C.sub,
        barWidth:2, barGap:1, barRadius:2, normalize:true, interact:true, url:src });
    } catch(e){ this.setState({err:true}); return; }
    this.ws.on('ready', ()=>this.setState({ready:true, err:false, dur:this.ws.getDuration()}));
    this.ws.on('timeupdate', (t)=>this.setState({cur:t}));
    this.ws.on('error', ()=>this.setState({err:true, playing:false}));
    this.ws.on('finish', ()=>this.setState({playing:false}));
    this.ws.on('play', ()=>this.setState({playing:true}));
    this.ws.on('pause', ()=>this.setState({playing:false}));
  }
  componentWillUnmount(){ if(this._retry) clearTimeout(this._retry); if(this.ws){ try{ this.ws.pause(); }catch(e){} try{ this.ws.destroy(); }catch(e){} } }
  pick(real){
    if(real===this.state.isReal) return;
    const src = real ? this.props.realSrc : this.props.synthSrc;
    if(!src) return;
    this.setState({ isReal:real, playing:false, ready:false, err:false, cur:0, dur:0 });
    if(this.ws){ try{ this.ws.setOptions({ progressColor: real?C.teal:C.amber }); this.ws.load(src); }catch(e){ this.setState({err:true}); } }
  }
  toggle(){ if(this.ws){ try{ this.ws.playPause(); }catch(e){} } }
  render(){
    const s=this.state, real=s.isReal, accent=real?C.teal:C.amber;
    const hasReal=!!this.props.realSrc, hasSynth=!!this.props.synthSrc, reduced=this.props.reduced;
    const tFont={ fontFamily:"'Libre Franklin',sans-serif" };

      : '<svg width="12" height="12" viewBox="0 0 13 13" aria-hidden="true"><path d="M3 1.5 L11 6.5 L3 11.5 Z" fill="#fff"/></svg>';
    const note = real ? this.props.realNote : this.props.synthNote;
    return h('div',{},
      // toggle
      h('div',{style:{display:'flex',gap:8,marginBottom:12}},
        h('button',{onClick:()=>this.pick(true), disabled:!hasReal, 'aria-pressed':real,
          style:Object.assign({},tFont,{flex:1,padding:'8px',borderRadius:7,border:'1px solid '+(real?C.teal:C.line),
            background:real?C.tealBg:C.bg, color:!hasReal?C.faint:(real?C.teal:C.sub),
            cursor:hasReal?'pointer':'not-allowed', fontSize:12,fontWeight:600,transition:reduced?'none':'all .25s ease'})}, 'Real recording'),
        h('button',{onClick:()=>this.pick(false), disabled:!hasSynth, 'aria-pressed':!real,
          style:Object.assign({},tFont,{flex:1,padding:'8px',borderRadius:7,border:'1px solid '+(!real?C.amber:C.line),
            background:!real?C.amberBg:C.bg, color:!hasSynth?C.faint:(!real?'#8a5f15':C.sub),
            cursor:hasSynth?'pointer':'not-allowed', fontSize:12,fontWeight:600,transition:reduced?'none':'all .25s ease'})}, 'Synthetic (AudioLDM 2)')),
      // player row
      h('div',{style:{display:'flex',alignItems:'center',gap:11}},
        h('button',{onClick:()=>this.toggle(), disabled:s.err,
          'aria-label':(s.playing?'Pause ':'Play ')+(real?'real recording':'synthetic clip')+' of '+this.props.species,
          style:{flexShrink:0,width:36,height:36,borderRadius:'50%',border:'none',background:s.err?C.faint:accent,
            cursor:s.err?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:reduced?'none':'background .25s ease'}},
          h('span',{style:{display:'flex'},dangerouslySetInnerHTML:{__html:icon}})),
        h('div',{style:{position:'relative',flex:1,minWidth:0}},
          h('div',{ref:this.elRef, role:'img',
            'aria-label':(real?'Real':'Synthetic')+' waveform for '+this.props.species, style:{width:'100%'}}),
          s.err?h('div',{style:{display:'flex',alignItems:'center',gap:3,position:'absolute',inset:0}},
            [10,18,28,20,34,24,14,30,22,12,26,16,32,18,10].map((hh,i)=>h('div',{key:i,style:{flex:1,height:hh,background:C.line,borderRadius:2}}))):null),

      // transcript line

        s.err? 'Clip unavailable — drop the file into assets/audio/species/ to enable playback.' : note));
  }
}

    this._compute = ()=>{
      if(this.state.staticMode || this.state.glossary || this.state.evidence) return;
      const center = (document.documentElement.clientHeight || 800) * 0.5;
      let best=0, bestDist=Infinity;
      document.querySelectorAll('[data-idx]').forEach(el=>{
        const r = el.getBoundingClientRect();
        const c = r.top + r.height/2;
        const d = Math.abs(c - center);
        if(d < bestDist){ bestDist = d; best = parseInt(el.getAttribute('data-idx'),10); }
      });
      if(!isNaN(best) && best!==this.state.active) this.setState({active:best});
    };
    // Real browsers: scroll events fire and give instant response.
    document.addEventListener('scroll', this._compute, {passive:true, capture:true});
    window.addEventListener('scroll', this._compute, {passive:true});
    // Fallback poll for environments where scroll events are suppressed.
    this._poll = setInterval(this._compute, 100);
  }
  componentWillUnmount(){
    if(this._poll) clearInterval(this._poll);
    if(this._compute){ document.removeEventListener('scroll', this._compute, {capture:true}); window.removeEventListener('scroll', this._compute); }

  flat(){ const out=[]; this.sections().forEach((s,si)=>s.steps.forEach((st,li)=>out.push(Object.assign({},st,{sectionKey:s.key,si,li,nSteps:s.steps.length,secTitle:s.title,num:s.num})))); return out; }

  // ---- helpers ----
  trans(extra){ return this.state.reduced ? 'none' : (extra||'all .5s cubic-bezier(.2,.7,.2,1)'); }
  go(id){ const el=document.getElementById(id); if(!el) return; const top=el.getBoundingClientRect().top+window.scrollY-70; window.scrollTo({top, behavior:this.state.reduced?'auto':'smooth'}); }
  toggleExp(k){ const e=Object.assign({}, this.state.expanded); e[k]=!this.expOpen(k); this.setState({expanded:e}); }
  expOpen(k){ const v=this.state.expanded[k]; if(v!==undefined) return v; const lvl=this.state.level; if(k.endsWith('|further')) return lvl>=1; if(k.endsWith('|tech')) return lvl>=3; return false; }

  // ================= STAGE =================
  renderStage(){
    const steps=this.flat(); const st=steps[this.state.active]||steps[0];
    const key=st.sectionKey; const reveal=st.li;
    const map={ hook:'stHook', longtail:'stLong', domain:'stDomain', taxa:'stTaxa', idea:'stIdea',
      matrix:'stMatrix', pipeline:'stPipe', filter:'stFilter', result:'stResult', benefit:'stBenefit',
      tradeoff:'stTrade', meaning:'stMeaning', synthesis:'stSynth' };
    const node=this[map[key]] ? this[map[key]](reveal) : null;
    return h('div',{key:key, style:{width:'100%',height:'100%',animation:this.state.reduced?'none':'fadeUp .45s ease'}}, node);
  }
  stageCaption(txt, fig){ return h('div',{style:{position:'absolute',left:0,right:0,bottom:0,padding:'14px 22px',background:'linear-gradient(transparent,rgba(20,25,20,.04))',fontFamily:"'Libre Franklin',sans-serif",fontSize:11,color:C.mut,letterSpacing:'.02em',display:'flex',justifyContent:'space-between',gap:12}},
    h('span',{}, txt), fig?h('span',{style:{color:C.faint}}, fig):null); }
  panel(children, extra){ return h('div',{style:Object.assign({position:'relative',width:'100%',height:'100%',display:'flex',flexDirection:'column',padding:'34px 38px',background:C.panel},extra||{})}, children); }
  stageTitle(t,sub){ return h('div',{style:{marginBottom:18}},
    h('div',{style:{fontFamily:"'Libre Franklin',sans-serif",fontSize:11,letterSpacing:'.16em',textTransform:'uppercase',color:C.tealL}}, sub||'Figure'),
    h('div',{style:{fontFamily:'Fraunces,serif',fontSize:23,fontWeight:600,color:C.ink,marginTop:4}}, t)); }

  stHook(){
    return h('div',{style:{position:'relative',width:'100%',height:'100%',overflow:'hidden',background:'#0d1410'}},
      h('img',{src:'assets/fig01-pantanal.jpg',alt:'Aerial photograph of the flooded Pantanal wetland',style:{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',opacity:.92,transform:this.state.reduced?'none':'scale(1.04)',transition:this.state.reduced?'none':'transform 14s ease'}}),

  axisBox(children){ return h('div',{style:{position:'relative',flex:1,background:C.card,border:'1px solid '+C.line,borderRadius:3,padding:'18px 20px',minHeight:0}}, children); }

  stLong(reveal){
    const W=560,H=320,pl=52,pr=24,pt=18,pb=40;
    const x=r=>pl+(r/203)*(W-pl-pr);
    const ly=v=>{ const lv=Math.log10(Math.max(v,1)); return pt+(1-(lv/Math.log10(600)))*(H-pt-pb); };
    const anchors=[[0,500],[18,470],[45,300],[90,150],[120,100],[151,50],[163,25],[176,10],[185,5],[195,2],[203,1]];
    const path=anchors.map((a,i)=>(i?'L':'M')+x(a[0]).toFixed(1)+' '+ly(a[1]).toFixed(1)).join(' ');
    const gridY=[1,10,100,500];
    const showCurve=reveal>=0, showThresh=reveal>=1, showShade=reveal>=2 || reveal>=3, showCall=reveal>=2;
    // rarity bands chart on step 3 (li index 2 has table content) -> show bands when reveal>=2
    return this.panel([
      this.stageTitle('Recordings per class, ranked','Fig 3 \u00b7 the long tail'),
      this.axisBox(h('svg',{viewBox:'0 0 '+W+' '+H,style:{width:'100%',height:'100%'}},
        gridY.map(g=>h('g',{key:'g'+g},
          h('line',{x1:pl,x2:W-pr,y1:ly(g),y2:ly(g),stroke:C.line2}),
          h('text',{x:pl-8,y:ly(g)+3,textAnchor:'end',fontSize:10,fill:C.mut,fontFamily:"'Libre Franklin',sans-serif"}, g))),
        h('text',{x:pl-38,y:H/2,fontSize:10,fill:C.mut,transform:'rotate(-90 '+(pl-38)+' '+(H/2)+')',textAnchor:'middle',fontFamily:"'Libre Franklin',sans-serif"},'recordings (log)'),
        h('text',{x:(W)/2,y:H-6,fontSize:10,fill:C.mut,textAnchor:'middle',fontFamily:"'Libre Franklin',sans-serif"},'class rank \u2192'),
        showShade?h('rect',{x:x(151),y:pt,width:x(203)-x(151),height:H-pt-pb,fill:C.amber,opacity:.10}):null,
        showThresh?[50,10].map(t=>h('g',{key:'t'+t},
          h('line',{x1:pl,x2:W-pr,y1:ly(t),y2:ly(t),stroke:t===10?C.rust:C.amber,strokeDasharray:'5 4',strokeWidth:1.4}),
          h('text',{x:W-pr,y:ly(t)-5,textAnchor:'end',fontSize:9.5,fill:t===10?C.rust:'#8a5f15',fontFamily:"'Libre Franklin',sans-serif"}, t+'-recording line'))):null,
        showCurve?h('path',{d:path,fill:'none',stroke:C.teal,strokeWidth:2.4,strokeLinejoin:'round',style:this.state.reduced?{}:{strokeDasharray:1400,strokeDashoffset:0,animation:'drawIn .9s ease'}}):null,
        showCall?h('g',{},
          h('circle',{cx:x(185),cy:ly(5),r:4,fill:C.amber}),
          h('text',{x:x(185)-6,y:ly(5)-8,textAnchor:'end',fontSize:10.5,fontWeight:600,fill:C.sub,fontFamily:'Libre Franklin'},'18 classes \u2264 5'),
          h('circle',{cx:x(201),cy:ly(1),r:4,fill:C.rust}),
          h('text',{x:x(201)-6,y:ly(1)-8,textAnchor:'end',fontSize:10.5,fontWeight:600,fill:C.rust,fontFamily:'Libre Franklin'},'4 classes = 1')):null
      )),
      reveal>=2 ? h('div',{style:{marginTop:14}}, this.bandBars()) : h('div',{style:{marginTop:14,height:1}}),
      this.miniNote('Recreated from Fig 3 (p.7). A count of available data, not of model error.')
    ]);
  }
  bandBars(){
    const bands=[['= 1',4,C.rust],['\u2264 5',18,C.amber],['\u2264 10',27,C.amber],['\u2264 25',40,C.tealL],['\u2264 50',52,C.tealL],['\u2264 100',83,C.teal]];
    const max=83;
    return h('div',{style:{display:'grid',gridTemplateColumns:'auto 1fr auto',gap:'4px 10px',alignItems:'center',fontFamily:'Libre Franklin',fontSize:11.5}},
      bands.map((b,i)=>[
        h('div',{key:'l'+i,style:{textAlign:'right',color:C.mut,fontFamily:"'Libre Franklin',sans-serif"}}, b[0]),
        h('div',{key:'b'+i,style:{height:13,background:C.line2,borderRadius:2,overflow:'hidden'}},
          h('div',{style:{height:'100%',width:(b[1]/max*100)+'%',background:b[2],transition:this.trans()}})),
        h('div',{key:'v'+i,style:{color:C.sub,fontWeight:600,minWidth:22}}, b[1])
      ]));
  }
  miniNote(t){ return h('div',{style:{marginTop:'auto',paddingTop:10,borderTop:'1px solid '+C.amber+'55',fontFamily:'Libre Franklin,sans-serif',fontSize:9.5,letterSpacing:'.07em',textTransform:'uppercase',color:C.faint}}, t); }

        h('div',{style:{fontFamily:'Libre Franklin,sans-serif',fontSize:12.5,letterSpacing:'.03em',color:'#9a9079',marginBottom:30}},'Ademar Tutor \u00b7 COMPX525, University of Waikato \u00b7 BirdCLEF-2026 \u00b7 Pantanal'),
        h('div',{style:{padding:'16px 20px',background:'rgba(18,30,26,.5)',border:'1px solid rgba(159,196,182,.24)',borderRadius:8,maxWidth:600,marginBottom:30,backdropFilter:'blur(5px)'}},

        h('div',{style:{display:'flex',gap:18,alignItems:'center',flexWrap:'wrap'}},
          h('button',{onClick:()=>this.go('sec-hook'),style:{padding:'13px 28px',borderRadius:9,background:C.teal,color:'#fff',border:'none',cursor:'pointer',fontFamily:'Libre Franklin,sans-serif',fontWeight:600,fontSize:15}},'Start reading  \u2193'),
          h('a',{href:'report/main.pdf',target:'_blank',style:{fontFamily:'Libre Franklin,sans-serif',fontSize:13.5,color:'#cbd8cf',fontWeight:600}},'Open the full paper (31 pp)'))));

  calibration(){

      h('div',{style:{fontSize:12.5,color:C.mut,marginBottom:9}},'How much background should we assume? (change any time)'),
      h('div',{style:{display:'flex',flexWrap:'wrap',gap:8}},
        LEVELS.map((l,i)=>h('button',{key:i,onClick:()=>this.setState({level:i}),
          style:{padding:'8px 13px',borderRadius:20,border:'1px solid '+(this.state.level===i?C.teal:C.line),background:this.state.level===i?C.tealBg:C.card,color:this.state.level===i?C.teal:C.sub,cursor:'pointer',fontFamily:'Libre Franklin',fontSize:12.5,fontWeight:this.state.level===i?600:400},'aria-pressed':this.state.level===i}, l))));

  finalScreen(){

      h('div',{style:{maxWidth:860,margin:'0 auto'}},
        h('div',{style:{fontFamily:"'Libre Franklin',sans-serif",fontSize:12,letterSpacing:'.18em',color:C.tealL,textTransform:'uppercase',marginBottom:14}},'13 \u00b7 What to remember'),
        h('h2',{style:{fontFamily:'Fraunces,serif',fontWeight:700,fontSize:'clamp(26px,4vw,40px)',margin:'0 0 12px',lineHeight:1.15}},'Synthetic audio is a targeted tool, not a cure.'),

            h('div',{style:{fontFamily:'Fraunces,serif',fontWeight:700,fontSize:22,color:C.tealL,marginBottom:8}}, (i+1).toString().padStart(2,'0')),

        h('div',{style:{display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}},
          h('button',{onClick:()=>{navigator.clipboard&&navigator.clipboard.writeText(bib);this.setState({copied:true});setTimeout(()=>this.setState({copied:false}),1600);},

          h('a',{href:'report/main.pdf',target:'_blank',style:{padding:'12px 22px',borderRadius:9,border:'1px solid rgba(255,255,255,.25)',color:'#f4f1ea',fontWeight:600,fontSize:14,textDecoration:'none'}},'Open report/main.pdf'),
          h('button',{onClick:()=>this.go('top'),style:{background:'none',border:'none',color:C.tealL,cursor:'pointer',fontSize:13.5,fontWeight:600}},'\u2191 Back to top')),
        h('pre',{className:'om-scroll',style:{marginTop:24,padding:'16px',background:'rgba(0,0,0,.25)',borderRadius:8,fontFamily:"'IBM Plex Mono',monospace",fontSize:11.5,color:'#bcc4b8',overflowX:'auto',lineHeight:1.6}}, bib)));

          style:{flex:1,padding:'9px',borderRadius:7,border:'1px solid '+((r===(i===0))?C.teal:C.line),background:(r===(i===0))?C.tealBg:C.bg,color:(r===(i===0))?C.teal:C.sub,cursor:'pointer',fontFamily:'Libre Franklin',fontSize:12.5,fontWeight:600},'aria-pressed':r===(i===0)}, l))),

         :'This clip passed the BirdNET filter and entered training, yet reproduces only the broad spectral envelope \u2014 the sharp, repeated call structure is missing.'),

  }

  // ===== Five-species gallery: the keep-rate chart, made audible (§08 mount) =====

        photo:'https://upload.wikimedia.org/wikipedia/commons/c/c9/Yacare_Caiman_%28Caiman_Yacare%29_-_Flickr_-_berniedup.jpg',

        synthSrc:'assets/audio/species/audioldm2_116570_000.ogg',

  filterGallery(){
    const species = this.filterSpecies();
    const mono={ fontFamily:"'Libre Franklin',sans-serif" };
    const card = (sp)=>{
      const err=!!this.state.photoErr['sp-'+sp.key];
      return h('div',{key:sp.key,style:{background:C.card,border:'1px solid '+C.line,borderLeft:'4px solid '+sp.color,
        borderRadius:10,boxShadow:'0 4px 16px rgba(0,0,0,.06)',padding:'16px 18px',marginBottom:14}},
        // header row
        h('div',{style:{display:'flex',gap:13,alignItems:'flex-start',marginBottom:11}},
          h('div',{style:{flexShrink:0,width:84}},
            h('button',{onClick:()=>this.setState({speciesModal:sp.key}),'aria-label':'More about '+(sp.common||sp.sci)+' — opens details',title:'More about '+(sp.common||sp.sci),
              style:{position:'relative',padding:0,border:'none',background:'none',cursor:'pointer',borderRadius:8,lineHeight:0,display:'block'}},
              err
                ? h('div',{'aria-label':sp.alt,role:'img',style:Object.assign({},mono,{width:84,height:84,borderRadius:8,background:sp.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9.5,color:'#fff',textAlign:'center',padding:6})}, sp.taxon)
                : h('img',{src:sp.photo,alt:sp.alt,loading:'lazy',
                    onError:()=>{ const p=Object.assign({},this.state.photoErr); p['sp-'+sp.key]=true; this.setState({photoErr:p}); },
                    style:{width:84,height:84,borderRadius:8,objectFit:'cover',border:'1px solid '+C.line,display:'block'}}),
              h('span',{'aria-hidden':true,style:{position:'absolute',right:5,bottom:5,width:20,height:20,borderRadius:'50%',background:'rgba(20,25,20,.62)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontFamily:'Libre Franklin',fontWeight:600}},'i')),
            h('div',{style:Object.assign({},mono,{fontSize:8.5,color:C.faint,marginTop:5,lineHeight:1.35})}, sp.credit)),
          h('div',{style:{minWidth:0,flex:1}},
            sp.common
              ? h('div',{style:{fontFamily:'Fraunces,serif',fontWeight:600,fontSize:17,color:C.ink,lineHeight:1.2}}, sp.common)
              : h('div',{style:{fontFamily:'Newsreader,serif',fontStyle:'italic',fontWeight:500,fontSize:16,color:C.ink,lineHeight:1.2}}, sp.sci),
            sp.common
              ? h('div',{style:{fontFamily:'Newsreader,serif',fontStyle:'italic',fontSize:13,color:C.mut,marginTop:1}}, sp.sci+(sp.syn?'  \u00b7  '+sp.syn:''))
              : h('div',{style:Object.assign({},mono,{fontSize:10,color:C.faint,marginTop:2})},'no verified common name'),
            h('div',{style:{display:'flex',alignItems:'center',gap:8,margin:'7px 0 0',flexWrap:'wrap'}},
              h('span',{style:Object.assign({},mono,{fontSize:9.5,letterSpacing:'.07em',textTransform:'uppercase',color:'#fff',background:sp.color,padding:'2px 8px',borderRadius:4})}, sp.taxon),
              h('span',{style:Object.assign({},mono,{fontSize:11,color:C.sub,fontWeight:600})}, sp.keep)))),
        // facts
        h('div',{style:{marginBottom:13}},
          sp.facts.map((f,i)=>h('div',{key:i,style:{fontSize:12,color:C.sub,lineHeight:1.5}}, f))),
        // player
        h(WaveAB,{key:sp.key+'-ws', species:sp.common||sp.sci, realSrc:sp.realSrc, synthSrc:sp.synthSrc,
          realNote:sp.realNote, synthNote:sp.synthNote, reduced:this.state.reduced}));
    };
    return h('div',{style:{maxWidth:560,margin:'10px 0 0'}},
      // block header
      h('div',{style:{fontFamily:"'Libre Franklin',sans-serif",fontSize:11,letterSpacing:'.12em',color:C.tealL,marginBottom:8}},'LISTEN \u00b7 WHAT THE FILTER LET THROUGH'),
      h('div',{style:{fontFamily:'Fraunces,serif',fontSize:16,fontWeight:500,lineHeight:1.32,color:C.ink,marginBottom:16,textWrap:'pretty'}},'Each synthetic clip is the model\u2019s attempt at the animal\u2019s call together with the field around it. Press play to compare it with the real recording.'),
      species.map(card),
      // closing "no birds" note
      h('div',{style:{padding:'13px 15px',background:'#f3e3dd',borderLeft:'4px solid '+C.rust,borderRadius:8,marginTop:2}},
        h('span',{style:{fontFamily:"'Libre Franklin',sans-serif",fontSize:11,letterSpacing:'.04em',fontWeight:600,color:C.rust}},'Aves \u00b7 0.0% kept. '),
        h('span',{style:{fontSize:12.5,color:C.sub,lineHeight:1.55}},'There is no bird card here \u2014 not an omission, but the finding. BirdNET rejected every generated bird clip, so none entered training. The verifier is strictest where it is most expert.')));
  }

  // ================= STATIC ARTICLE =================
  staticArticle(){
    const steps=this.flat();
    return h('div',{className:'om-scroll',style:{maxWidth:720,margin:'0 auto',padding:'90px 24px 120px'}},
      h('div',{style:{fontFamily:"'Libre Franklin',sans-serif",fontSize:11,color:C.tealL,marginBottom:8}},'STATIC ARTICLE VERSION \u2014 no scroll effects'),
      h('h1',{style:{fontFamily:'Fraunces,serif',fontSize:34,fontWeight:700,lineHeight:1.15,marginTop:0}},'Can Generative AI Improve Bioacoustic Classification?'),
      h('p',{style:{color:C.mut,fontSize:14}},'Ademar Tutor \u00b7 COMPX525, University of Waikato \u00b7 ',h('a',{href:'report/main.pdf',target:'_blank',style:{color:C.teal}},'report/main.pdf')),
      this.sections().map(s=>h('section',{key:s.key,style:{marginTop:40}},
        h('h2',{style:{fontFamily:'Fraunces,serif',fontSize:23,fontWeight:600,color:C.teal,borderBottom:'1px solid '+C.line,paddingBottom:8}}, s.num+'. '+s.title),
        s.steps.map((st,i)=>h('div',{key:i,style:{marginTop:16}},
          h('p',{style:{fontFamily:'Newsreader,serif',fontSize:19,lineHeight:1.62,margin:0,color:C.ink}}, st.main),
          st.further?h('p',{style:{fontSize:14.5,lineHeight:1.6,color:C.sub,marginTop:6}}, st.further):null,
          st.tech?h('p',{style:{fontSize:13.5,lineHeight:1.6,color:C.mut,marginTop:6,fontStyle:'italic'}}, st.tech):null,
          h('div',{style:{fontFamily:"'Libre Franklin',sans-serif",fontSize:11,color:CLAIM[st.ev.t].c,marginTop:6}}, CLAIM[st.ev.t].label+' \u00b7 '+st.ev.s))))));
  }

  // ================= ROOT RENDER =================
  renderApp(){
    if(this.state.staticMode){
      return h('div',{style:{background:C.bg,minHeight:'100vh'}}, this.topBar(), this.staticArticle(), this.renderGlossaryDrawer(), this.renderEvidenceDrawer(), this.renderAnimalModal(), this.renderAudioLDMModal(), this.renderSpeciesModal());
    }
    const steps=this.flat();
    const audioAt = steps.findIndex(s=>s.sectionKey==='filter' && s.li===1);
    return h('div',{style:{background:C.bg,minHeight:'100vh', filter:this.state.hc?'contrast(1.15)':'none'}},
      this.topBar(), this.rail(),
      this.hero(),
      h('div',{style:{display:'flex',gap:'4vw',maxWidth:1320,margin:'0 auto',padding:'0 60px 0 80px',alignItems:'flex-start'}},
        // story column
        h('div',{style:{flex:'0 0 42%',maxWidth:480,paddingBottom:'30vh'}},
          steps.map((st,idx)=>[
            st.li===0?h('div',{key:'anchor'+st.sectionKey,id:'sec-'+st.sectionKey,style:{position:'relative',top:-60,height:0}}):null,
            this.renderStep(st, idx),
            idx===audioAt?h('div',{key:'audio',style:{paddingBottom:40}}, this.filterGallery()):null
          ])),
        // sticky stage
        h('div',{style:{flex:1,position:'sticky',top:64,height:'calc(100vh - 84px)',paddingTop:20}},
          h('div',{style:{width:'100%',height:'100%',borderRadius:12,overflow:'hidden',border:'1px solid '+C.line,boxShadow:'0 8px 30px rgba(31,40,33,.07)',background:C.panel}},
            this.renderStage()))),
      this.finalScreen(),
      this.techStack(),
      this.renderGlossaryDrawer(), this.renderEvidenceDrawer(), this.renderAnimalModal(), this.renderAudioLDMModal(), this.renderSpeciesModal());
  }

  renderVals(){ return { app: this.renderApp() }; }
}
